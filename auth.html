<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ventech | Cuenta</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body class="auth">
    <a class="logo floating" href="Ventech.html">Ven<span>Tech</span></a>
    <main class="authbox">
      <div>
        <p class="tag">TU CUENTA VENTECH</p>
        <h1>Compra, factura y rastrea tus pedidos.</h1>
        <p>
          La cuenta es necesaria para tu historial de compras y datos de
          entrega.
        </p>
      </div>
      <section class="card">
        <div class="tabs">
          <button onclick="VT.auth('login')">Iniciar sesión</button
          ><button onclick="VT.auth('register')">Crear cuenta</button>
        </div>
        <form id="login" onsubmit="VT.login(event)">
          <label>Correo<input type="email" required /></label
          ><label>Contraseña<input type="password" required /></label
          ><label><input type="checkbox" /> Recordar mis datos</label
          ><a
            href="#"
            onclick="
              VT.recover();
              return false;
            "
            >Recuperar contraseña</a
          ><button class="button full">Ingresar</button>
        </form>
        <form id="register" class="hide" onsubmit="VT.register(event)">
          <label>Nombres<input required /></label
          ><label>Apellidos<input required /></label
          ><label>Documento<input required /></label
          ><label>Teléfono<input required /></label
          ><label>Correo<input type="email" required /></label
          ><label>Contraseña<input type="password" required /></label
          ><label>Confirmar contraseña<input type="password" required /></label
          ><label
            ><input type="checkbox" required /> Acepto
            <a href="terminos.html" target="_blank" rel="noopener">términos y condiciones</a></label>
          ><button class="button full">Crear cuenta</button>
        </form>
      </section>
    </main>
    <script src="app.js?v=7"></script>
    <script type="module" src="supabase-auth.js?v=1"></script>
    <script>
      if (new URLSearchParams(location.search).get("modo") === "registro")
        VT.auth("register");
    </script>
  </body>
</html>
